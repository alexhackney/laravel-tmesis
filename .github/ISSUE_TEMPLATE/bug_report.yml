name: Bug report
description: Something does not work as documented
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: v0.9.6
    validations:
      required: true
  - type: input
    id: tmesis
    attributes:
      label: Tmesis node version
      placeholder: v0.9.6
  - type: input
    id: stack
    attributes:
      label: PHP and Laravel versions
      placeholder: PHP 8.4, Laravel 12
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the exception class and message. Never paste tokens, secrets or publish keys.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
